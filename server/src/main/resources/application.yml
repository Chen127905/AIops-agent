spring:
  application:
    name: ops-agent-platform
  flyway:
    enabled: false

app:
  datasource:
    business:
      url: "${MYSQL_URL:jdbc:mysql://localhost:3307/ops_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
      username: "${MYSQL_USERNAME:ops_agent}"
      password: "${MYSQL_PASSWORD:change-me-mysql}"
      driver-class-name: com.mysql.cj.jdbc.Driver
    vector:
      enabled: "${VECTOR_DATASOURCE_ENABLED:false}"
      url: "${POSTGRES_URL:jdbc:postgresql://localhost:5433/ops_agent_vector}"
      username: "${POSTGRES_USERNAME:ops_agent}"
      password: "${POSTGRES_PASSWORD:change-me-postgres}"
      driver-class-name: org.postgresql.Driver
  security:
    jwt:
      issuer: ops-agent-platform
      secret: "${JWT_SECRET:local-development-secret-change-before-production}"
      ttl: "${JWT_TTL:PT2H}"
  ai:
    qwen:
      api-key: "${AI_DASHSCOPE_API_KEY:}"
      base-url: "${AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}"
      model: "${AI_DASHSCOPE_MODEL:qwen-plus}"
      embedding-model: "${AI_DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}"
      embedding-dimensions: "${AI_DASHSCOPE_EMBEDDING_DIMENSIONS:1024}"
    deepseek:
      api-key: "${DEEPSEEK_API_KEY:}"
      base-url: "${DEEPSEEK_BASE_URL:https://api.deepseek.com}"
      model: "${DEEPSEEK_MODEL:deepseek-chat}"
  agent:
    provider: "${AGENT_MODEL_PROVIDER:QWEN}"
    worker-id: "${AGENT_WORKER_ID:local-agent-worker}"
    lease: "${AGENT_LEASE:PT4M}"
    approval-ttl: "${AGENT_APPROVAL_TTL:PT30M}"
    defaults:
      max-steps: "${AGENT_MAX_STEPS:12}"
      timeout: "${AGENT_TIMEOUT:PT3M}"
      max-tokens: "${AGENT_MAX_TOKENS:20000}"
    executor:
      core-size: "${AGENT_EXECUTOR_CORE_SIZE:2}"
      max-size: "${AGENT_EXECUTOR_MAX_SIZE:8}"
      queue-capacity: "${AGENT_EXECUTOR_QUEUE_CAPACITY:32}"

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
