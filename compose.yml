services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ops_agent
      MYSQL_USER: ops_agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ops_agent_vector
      POSTGRES_USER: ops_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_agent -d ops_agent_vector"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build:
      context: ./server
    environment:
      MYSQL_URL: jdbc:mysql://mysql:3306/ops_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      MYSQL_USERNAME: ops_agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      VECTOR_DATASOURCE_ENABLED: "true"
      POSTGRES_URL: jdbc:postgresql://pgvector:5432/ops_agent_vector
      POSTGRES_USERNAME: ops_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-QWEN}
      KNOWLEDGE_EMBEDDING_PROVIDER: ${KNOWLEDGE_EMBEDDING_PROVIDER:-LOCAL}
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  demo-seed:
    image: mysql:8.4
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - ./deploy/mysql/demo-data.sql:/seed/demo-data.sql:ro
    command: ["sh", "-c", "mysql -h mysql -u ops_agent ops_agent < /seed/demo-data.sql"]
    depends_on:
      server:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./web
    ports:
      - "${APP_PORT:-8088}:8080"
    depends_on:
      server:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  pgvector-data:
